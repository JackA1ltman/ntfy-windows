[package]
name = "ntfy-windows"
version = "0.1.1"
edition = "2021"
description = "Windows notification daemon that forwards ntfy.sh notifications to native Windows toast notifications"
license = "MIT"
readme = "README.md"
authors = ["ntfy-windows contributors"]
keywords = ["ntfy", "notifications", "windows", "toast", "tray"]
categories = ["command-line-utilities", "gui"]
repository = "https://github.com/JackA1ltman/ntfy-windows"
homepage = "https://github.com/JackA1ltman/ntfy-windows"
rust-version = "1.77"

[[bin]]
name = "ntfy-windows"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.27"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
open = "5"
raw-window-handle = "0.6"
rfd = "0.14"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.52"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
